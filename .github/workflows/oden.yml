name: oden

on:
  push:
    paths: ["oden/**", "testdata/**", ".github/workflows/oden.yml"]
  pull_request:
    paths: ["oden/**", "testdata/**", ".github/workflows/oden.yml"]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: oden
        run: npm test
      - name: CLI
        run: ./oden/oden --help
